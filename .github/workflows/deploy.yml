name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # A GITHUB_TOKEN push (the publish workflow promoting an approved draft) does not start other
  # workflows, so the merge that publishes an article would otherwise not deploy. Run after it.
  workflow_run:
    workflows: ["Publish an approved content draft"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.12'

      - name: Install dependencies
        run: npm ci

      # 카드 PNG는 저장소에 없다. SVG에서 매 빌드마다 새로 만든다(카드 SVG에 DRM이 걸릴 일이 없도록).
      - name: Render card PNGs from SVG
        run: node scripts/render-cards.mjs

      - name: Build the site
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.12'

      # Bing·Yandex·Naver에 새 글 주소를 알린다. 실패해도 배포는 그대로 둔다.
      - name: Ping IndexNow for changed article URLs
        continue-on-error: true
        run: node scripts/indexnow.mjs --changed
