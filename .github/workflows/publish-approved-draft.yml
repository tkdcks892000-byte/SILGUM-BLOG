name: Publish an approved content draft

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

concurrency:
  group: publish-approved-content-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      startsWith(github.event.pull_request.head.ref, 'automation/evidence-draft-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the merged main branch
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.12'

      - name: Promote and publish the approved draft
        env:
          PULL_REQUEST_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: node scripts/publish-approved-draft.mjs
