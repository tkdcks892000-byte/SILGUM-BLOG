name: Tistory promo post (manual)

on:
  workflow_dispatch:
    inputs:
      source:
        description: '원본 글 경로 (예: src/content/blog/my-post.md)'
        required: true
        type: string
      original_url:
        description: '원본 글 공개 URL (선택)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: tistory-post-${{ github.repository }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out blog repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.12'

      - name: Check required secrets
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          test -n "$OPENAI_API_KEY" || { echo "Add OPENAI_API_KEY to this repository's Actions secrets."; exit 1; }

      - name: Generate a Tistory-ready promo post
        id: post
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'poolside/laguna-s-2.1:free' }}
          SOURCE_PATH: ${{ inputs.source }}
          ORIGINAL_URL: ${{ inputs.original_url }}
        run: node scripts/generate-tistory-post.mjs

      - name: Commit the promo post to outbox
        env:
          OUT_PATH: ${{ steps.post.outputs.out_path }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$OUT_PATH"
          if git diff --cached --quiet; then
            echo "outbox already has this promo post; nothing to commit."
            exit 0
          fi
          git commit -m "docs: prepare tistory promo post"
          git push origin HEAD:main

      - name: Upload the promo post as an artifact
        uses: actions/upload-artifact@v5
        with:
          name: tistory-promo-post
          path: ${{ steps.post.outputs.out_path }}
          if-no-files-found: error
