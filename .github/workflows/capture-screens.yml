name: Capture SILGUM screens (manual)

# Re-takes public/screens/*.webp from the live site. Runs here, not on the operator's PC, whose
# security software encrypts newly written image files.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22.12'
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium

      - name: Capture
        run: node scripts/capture-screens.mjs

      - name: Commit the new screens
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- public/screens
          if git diff --cached --quiet; then
            echo "screens unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "chore: re-capture SILGUM screens from the live site"
          git push origin HEAD:main

      - uses: actions/upload-artifact@v5
        with:
          name: silgum-screens
          path: public/screens/*.webp
